<!doctype html>
<meta charset="utf-8">
<title>6AU6 Pentode — interactive simulation</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Interactive 6AU6 pentode simulation: electrons,
  space charge, screen grid, load lines and plate characteristics, in the browser.">

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
}}
</script>

<style>
  :root {
    --bg: #0a0c10; --panel: #14171d; --edge: #262b34;
    --ink: #d7dce4; --dim: #8b94a3; --hot: #4fd08a; --warn: #e8a33d;
    --font: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13px/1.45 var(--font);
    display: flex; overflow: hidden;
  }
  #stage { flex: 1; position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: absolute; left: 14px; top: 12px; pointer-events: none;
    font-size: 12px; color: var(--dim); letter-spacing: .02em;
  }
  #hud b { color: var(--ink); font-weight: 600; }

  #panel {
    width: 310px; flex: none; background: var(--panel);
    border-left: 1px solid var(--edge); overflow-y: auto;
    padding: 14px 16px 28px; scrollbar-width: thin;
  }
  #panel h1 {
    font-size: 12px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--dim); margin: 0 0 10px; font-weight: 600;
  }
  select, button {
    font: inherit; color: var(--ink); background: #1c212a;
    border: 1px solid var(--edge); border-radius: 5px; padding: 6px 8px;
    cursor: pointer;
  }
  select { width: 100%; margin-bottom: 14px; }
  button:hover { background: #242a35; border-color: #39414f; }
  button.on { background: #23422f; border-color: #2f6b45; color: #b9f0cf; }

  .row { display: flex; gap: 6px; margin-bottom: 8px; }
  .row button { flex: 1; padding: 6px 4px; font-size: 12px; }

  .ctl { margin-bottom: 11px; }
  .ctl label {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 12px; color: var(--dim); margin-bottom: 3px;
  }
  .ctl label span { color: var(--ink); font-variant-numeric: tabular-nums; }
  input[type=range] {
    width: 100%; height: 18px; margin: 0; accent-color: #4a7fd0;
    background: transparent; cursor: pointer;
  }
  .chk {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    cursor: pointer; font-size: 12.5px;
  }
  .chk input { accent-color: #4a7fd0; width: 15px; height: 15px; margin: 0; }

  hr { border: 0; border-top: 1px solid var(--edge); margin: 14px 0; }

  #meter {
    background: #0c0f14; border: 1px solid var(--edge); border-radius: 6px;
    padding: 9px 11px; font-size: 12px; white-space: pre-line;
    color: var(--hot); min-height: 2em; font-variant-numeric: tabular-nums;
  }
  #note { color: var(--warn); font-size: 12px; margin-top: 8px; }
  #help { color: var(--dim); font-size: 11.5px; margin-top: 14px; }
  #help a { color: #7aa7e0; }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    #panel { width: 100%; border-left: 0; border-top: 1px solid var(--edge);
             max-height: 46vh; }
  }
</style>

<div id="stage">
  <canvas id="gl"></canvas>
  <div id="hud"></div>
</div>

<div id="panel">
  <h1>Simulation</h1>
  <select id="sim"></select>

  <div class="row">
    <button id="play">Run</button>
    <button id="reset">Reset</button>
  </div>
  <div class="row" id="views"></div>

  <hr>
  <div id="controls"></div>

  <hr>
  <div id="meter"></div>
  <div id="note"></div>

  <div id="help">
    Drag to orbit, scroll to zoom.
    The sim is stateful — use <b>Reset</b>, not the browser back button.
    <br><br>
    Ported from the Blender original; physics verified against it by
    <code>node web/selfcheck.js</code>.
  </div>
</div>

<script type="module" src="./main.js"></script>
